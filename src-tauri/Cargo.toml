[package]
name = "spindex"
version = "1.0.0"
edition = "2021"
description = "Offline-first DJ library manager"
license = "MIT"
default-run = "spindex"

[lib]
name = "spindex"
path = "src/lib.rs"

[[bin]]
name = "spindex-scan"
path = "src/bin/spindex_scan.rs"

[[bin]]
name = "spindex-analyzer"
path = "src/bin/spindex_analyzer.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
walkdir = "2"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
rustfft = "6"
ort = { version = "=2.0.0-rc.12", features = ["download-binaries"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp"] }

[profile.release]
lto = true
